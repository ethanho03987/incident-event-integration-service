# Full local stack:  docker compose up -d --build
#   API + Swagger   http://localhost:8080/swagger-ui.html
#   RabbitMQ UI     http://localhost:15672   (guest / guest)
#   Prometheus      http://localhost:9090
#   Grafana         http://localhost:3000    (dashboard "Incident Event Integration Service")

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: incidents
      MYSQL_USER: incident
      MYSQL_PASSWORD: incident
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
      - "15692:15692"   # Prometheus metrics for the broker itself
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      RABBIT_HOST: rabbitmq
      WEBHOOK_SECRET: local-dev-secret-change-me
      DISPATCH_FAILURE_RATE: ${DISPATCH_FAILURE_RATE:-0.0}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # demo only: no login needed
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/incident-service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
