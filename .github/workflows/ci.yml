name: CI

# Runs on every push and pull request: build, unit tests, integration tests (Testcontainers),
# coverage check (fails under 70%), Docker image build, then a 50 events/sec load test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile -> unit tests (surefire) -> integration tests (failsafe) -> JaCoCo report + 70% check
      - name: Build and run all tests
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "### Line coverage: %.1f%% (%d of %d lines)\n", 100*covered/(missed+covered), covered, missed+covered}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/

  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t incident-service:${{ github.sha }} .

  load-test:
    name: Load test (50 events/sec)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up -d --build --wait

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 at 50 events/sec for 2 minutes
        run: k6 run --summary-export loadtest/results/summary.json loadtest/incident-load-test.js

      - name: Verify no messages were lost
        run: ./loadtest/verify-no-loss.sh

      - name: Load test summary
        if: always()
        run: |
          echo "### Load test" >> "$GITHUB_STEP_SUMMARY"
          cat loadtest/results/verification.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No verification output" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: loadtest/results/

      - name: Service logs on failure
        if: failure()
        run: docker compose logs app --tail 200

      - name: Stop stack
        if: always()
        run: docker compose down -v
